[project]
name = "slideharness-next"
version = "0.3.0"
description = "Greenfield arbitrary-template PPTX generation vertical slice"
requires-python = ">=3.10"
dependencies = [
  "python-pptx>=1.0.0",
  "python-docx>=1.1.0",
  "pypdf>=5.0.0",
  "Pillow>=10.0.0"
]

[project.scripts]
slideharness-next = "slideharness_next.cli:main"

[tool.setuptools]
packages = ["slideharness_next"]
