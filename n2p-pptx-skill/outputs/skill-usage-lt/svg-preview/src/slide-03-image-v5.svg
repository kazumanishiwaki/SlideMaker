  <rect class="gray" x="1298" y="430" width="70" height="44" rx="6"/>
  <rect class="gray" x="1382" y="430" width="70" height="44" rx="6"/>
  <rect class="yellow" x="1466" y="430" width="70" height="44" rx="6"/>
  <line class="s" x1="1374" y1="414" x2="1374" y2="490"/>
  <line class="s" x1="1458" y1="414" x2="1458" y2="490"/>
