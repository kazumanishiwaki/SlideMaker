    </style>
  </defs>
  <rect class="bg" width="1672" height="941"/>

  <!-- request -->
  <path class="card" d="M122 332 H420 Q456 332 456 368 V492 Q456 528 420 528 H256 L170 606 V528 H122 Q86 528 86 492 V368 Q86 332 122 332 Z"/>
